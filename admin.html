<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Raj Building Material</title>

  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
    header{background:#111;color:white;padding:18px;text-align:center}
    header h1{margin:0;font-size:25px}
    header p{margin:6px 0 0;color:#ddd}

    .search{
      padding:15px;
      background:white;
      position:sticky;
      top:0;
      z-index:5;
    }

    #search{
      width:100%;
      padding:13px;
      border:1px solid #ddd;
      border-radius:8px;
      font-size:16px;
    }

    .container{padding:15px;max-width:1100px;margin:auto}

    .categories{
      display:flex;
      gap:8px;
      overflow-x:auto;
      margin-bottom:15px;
    }

    .categories button{
      border:0;
      padding:10px 15px;
      border-radius:20px;
      background:#ddd;
      white-space:nowrap;
    }

    .products{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
      gap:15px;
    }

    .card{
      background:white;
      border-radius:12px;
      padding:12px;
      box-shadow:0 2px 10px #ddd;
    }

    .card img{
      width:100%;
      height:150px;
      object-fit:contain;
      border-radius:8px;
      background:#fafafa;
    }

    .card h3{font-size:17px;margin:10px 0 5px}
    .price{font-size:19px;font-weight:bold}
    .category{color:#777;font-size:13px}

    .cart{
      position:fixed;
      right:18px;
      bottom:18px;
      background:#111;
      color:white;
      padding:15px 20px;
      border-radius:30px;
      border:0;
      font-size:16px;
      box-shadow:0 3px 12px #777;
    }

    .empty{text-align:center;padding:40px;color:#777}
  </style>
</head>

<body>

<header>
  <h1>New Raj Building Material</h1>
  <p>Kukshi</p>
</header>

<div class="search">
  <input id="search" type="text" placeholder="🔍 Product search करें...">
</div>

<div class="container">

  <div class="categories">
    <button onclick="filterProducts('all')">All</button>
    <button onclick="filterProducts('Cement')">Cement</button>
    <button onclick="filterProducts('Steel')">Steel</button>
    <button onclick="filterProducts('Hardware')">Hardware</button>
  </div>

  <div id="products" class="products">
    <div class="empty">Products loading...</div>
  </div>

</div>

<button class="cart" onclick="showCart()">
  🛒 Cart (<span id="cartCount">0</span>)
</button>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyBszu5iOeeCmYuxtdFRXQOekhqFbIok9OA",
  authDomain: "new-raj-building-material.firebaseapp.com",
  projectId: "new-raj-building-material",
  storageBucket: "new-raj-building-material.firebasestorage.app",
  messagingSenderId: "683554895902",
  appId: "1:683554895902:web:27751015cbea96508a160f"
};


const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allProducts = [];
let cart = [];


async function loadProducts(){

  const productBox = document.getElementById("products");

  try{

    const snapshot = await getDocs(
      collection(db,"products")
    );

    allProducts = [];

    snapshot.forEach(doc => {

      allProducts.push({
        id:doc.id,
        ...doc.data()
      });

    });

    displayProducts(allProducts);

  }catch(error){

    productBox.innerHTML =
      "<div class='empty'>Products load नहीं हो पाए।</div>";

    console.error(error);

  }

}


function displayProducts(products){

  const box = document.getElementById("products");

  box.innerHTML = "";

  if(products.length === 0){

    box.innerHTML =
      "<div class='empty'>अभी कोई product उपलब्ध नहीं है।</div>";

    return;

  }


  products.forEach(product => {

    const image = product.imageUrl
      ? product.imageUrl
      : "https://via.placeholder.com/300x200?text=Product";


    box.innerHTML += `

      <div class="card">

        <img src="${image}" alt="${product.name}">

        <h3>${product.name}</h3>

        <div class="category">
          ${product.category || ""}
        </div>

        <div class="price">
          ₹${product.price || 0}
        </div>

        <p>
          Stock: ${product.stock || 0}
        </p>

        <button onclick="addToCart('${product.id}')">
          🛒 Add to Cart
        </button>

      </div>

    `;

  });

}


window.addToCart = function(id){

  const product =
    allProducts.find(p => p.id === id);

  if(!product) return;

  cart.push(product);

  document.getElementById("cartCount").innerText =
    cart.length;

  alert("Product cart में add हो गया ✅");

};


window.showCart = function(){

  if(cart.length === 0){

    alert("Cart अभी खाली है.");

    return;

  }


  let message = "आपका Cart:\\n\\n";

  let total = 0;


  cart.forEach((item,index)=>{

    message +=
      `${index+1}. ${item.name} - ₹${item.price}\\n`;

    total += Number(item.price || 0);

  });


  message +=
    `\\nTotal: ₹${total}`;


  alert(message);

};


window.filterProducts = function(category){

  if(category === "all"){

    displayProducts(allProducts);

    return;

  }


  const filtered =
    allProducts.filter(
      p => p.category === category
    );

  displayProducts(filtered);

};


document.getElementById("search")
.addEventListener("input",function(){

  const text =
    this.value.toLowerCase();

  const filtered =
    allProducts.filter(p =>
      (p.name || "")
      .toLowerCase()
      .includes(text)
    );

  displayProducts(filtered);

});


loadProducts();

</script>

</body>
</html>
