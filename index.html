<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Raj Building Material</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .logo span {
            display: block;
            font-size: 12px;
            color: #ccc;
            letter-spacing: 2px;
        }

        .cart {
            background: white;
            color: #111;
            padding: 10px 15px;
            border-radius: 8px;
        }

        .hero {
            background: linear-gradient(120deg, #171717, #555);
            color: white;
            padding: 70px 6%;
            text-align: center;
        }

        .hero h1 {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .hero p {
            font-size: 18px;
            margin-bottom: 25px;
        }

        .hero button {
            padding: 13px 25px;
            border: none;
            border-radius: 8px;
            background: white;
            color: #111;
            font-weight: bold;
            cursor: pointer;
        }

        .container {
            padding: 40px 6%;
        }

        .container h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .products {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .product {
            background: white;
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .product-image {
            height: 160px;
            background: #eee;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            font-size: 45px;
        }

        .product h3 {
            margin-bottom: 8px;
        }

        .category {
            color: #777;
            font-size: 14px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            margin: 12px 0;
        }

        .product button {
            width: 100%;
            padding: 11px;
            background: #111;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }

        footer {
            background: #111;
            color: white;
            text-align: center;
            padding: 25px;
            margin-top: 30px;
        }

        @media(max-width:600px) {
            .hero h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        NEW RAJ
        <span>BUILDING MATERIAL</span>
    </div>

    <div class="cart">
        🛒 Cart:
        <span id="cartCount">0</span>
    </div>

</header>


<section class="hero">

    <h1>New Raj Building Material</h1>

    <p>Cement • Steel • Hardware</p>

    <button onclick="document
        .getElementById('products')
        .scrollIntoView()">

        View Products

    </button>

</section>


<section class="container" id="products">

    <h2>Our Products</h2>

    <div class="products">


        <div class="product">

            <div class="product-image">
                🏗️
            </div>

            <h3>Ultratech Cement</h3>

            <div class="category">
                Cement
            </div>

            <div class="price">
                ₹320
            </div>

            <button onclick="addToCart()">
                Add to Cart
            </button>

        </div>


        <div class="product">

            <div class="product-image">
                🔩
            </div>

            <h3>TMT Steel</h3>

            <div class="category">
                Steel
            </div>

            <div class="price">
                ₹5,750
            </div>

            <button onclick="addToCart()">
                Add to Cart
            </button>

        </div>


        <div class="product">

            <div class="product-image">
                🧱
            </div>

            <h3>Building Hardware</h3>

            <div class="category">
                Hardware
            </div>

            <div class="price">
                Contact for Price
            </div>

            <button onclick="addToCart()">
                Add to Cart
            </button>

        </div>


    </div>

</section>


<footer>

    <h3>New Raj Building Material</h3>

    <p>Quality Building Materials</p>

</footer>


<script>

let cart = 0;

function addToCart() {

    cart++;

    document.getElementById("cartCount")
        .innerText = cart;

    alert("Product added to cart!");

}

</script>

</body>
</html>
